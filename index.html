<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing 每日壁纸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="bgA" class="bg"></div>
    <div id="bgB" class="bg"></div>

    <div class="search-wrapper">
        <form class="search-box" action="https://www.google.com/search" method="GET" target="_blank">
            <svg class="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <input type="text" name="q" placeholder="" autocomplete="off" autofocus>
        </form>
    </div>

    <!-- 左下角设置按钮 -->
    <div class="settings-area" id="settingsArea">
        <button class="settings-btn" id="settingsBtn" title="设置">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1.08 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001.08 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1.08z"/>
            </svg>
        </button>
        <div class="settings-popup card" id="settingsPopup">
            <label class="settings-option">
                <input type="checkbox" id="toggleSearch" checked>
                <span>显示搜索栏</span>
            </label>
        </div>
    </div>

    <div class="controls" id="controlsRegion">
        <div class="card-container">
            <div class="card brief-card" id="briefCard">加载中…</div>
            <button class="nav-btn" id="prevBtn" title="上一张">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                    <path d="M11 14L5 8l6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="nav-btn" id="nextBtn" title="下一张">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                    <path d="M5 14l6-6-6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="card detail-card" id="detailCard">
            <h3 id="imageTitle"></h3>
            <div class="hr"></div>
            <div class="meta" id="imageMeta"></div>
        </div>
    </div>

    <script>
        // 代理避免CORS失败
        const API = 'https://mutsumi.sorali.org/api/cors/https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=8&mkt=zh-CN';
        const CACHE_KEY = 'bing_daily_wallpaper_v2';
        const CACHE_DATE_KEY = 'bing_wallpaper_date';

        const bgA = document.getElementById('bgA');
        const bgB = document.getElementById('bgB');
        const briefCard = document.getElementById('briefCard');
        const detailCard = document.getElementById('detailCard');
        const titleEl = document.getElementById('imageTitle');
        const metaEl = document.getElementById('imageMeta');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const controlsRegion = document.getElementById('controlsRegion');
        const cardContainer = document.querySelector('.card-container');

        let images = [];
        let currentIndex = 0;
        let copyrightlinkUrl = null;
        let front = bgA, back = bgB;
        let isAnimating = false;

        // 获取今天日期字符串（用于缓存判断）
        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
        }

        // 从缓存读取图片数据
        function getCachedImages() {
            try {
                const date = localStorage.getItem(CACHE_DATE_KEY);
                if (date === getTodayStr()) {
                    const raw = localStorage.getItem(CACHE_KEY);
                    if (raw) return JSON.parse(raw);
                }
            } catch (e) { /* 忽略缓存读取错误 */ }
            return null;
        }

        // 保存图片数据到缓存
        function setCachedImages(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                localStorage.setItem(CACHE_DATE_KEY, getTodayStr());
            } catch (e) { /* 忽略缓存写入错误 */ }
        }

        function showBackground(url) {
            if (!url) return;
            if (isAnimating) return;
            isAnimating = true;

            const img = new Image();
            img.onload = function() {
                back.style.backgroundImage = `url("${url}")`;
                back.classList.add('show');
                front.classList.remove('show');
                const onEnd = () => {
                    back.removeEventListener('transitionend', onEnd);
                    let tmp = front;
                    front = back;
                    back = tmp;
                    isAnimating = false;
                };
                back.addEventListener('transitionend', onEnd);
                // 安全超时兜底，防止 transitionend 不触发
                setTimeout(() => {
                    if (isAnimating) {
                        let tmp = front;
                        front = back;
                        back = tmp;
                        isAnimating = false;
                    }
                }, 1000);
            };
            img.src = url;
        }

        function extractShort(s) {
            if (!s) return '每日壁纸';
            const str = String(s);
            const sep = [' — ', ' - ', '（', '(', '，', ', ', ' · '];
            for (const p of sep) {
                const idx = str.indexOf(p);
                if (idx > 0) return str.slice(0, idx);
            }
            return str.length > 40 ? str.slice(0, 37) + '...' : str;
        }

        function updateInfo(img) {
            const title = img.title || extractShort(img.copyright);
            briefCard.textContent = extractShort(title);
            titleEl.textContent = title;
            // 在左括号前插入换行，使版权归属另起一行
            const copyright = img.copyright || '';
            // 过滤掉"了解更多"及其后的链接文本
            const cleaned = copyright.replace(/了解更多.*$/i, '').trim();
            metaEl.innerHTML = cleaned.replace(/\(/g, '<br>(');
            // 模拟 Bing 原版"了解更多"的 filters 参数，触发搜索页显示"必应上的今天"
            if (img.copyrightlink) {
                const u = new URL(img.copyrightlink);
                u.searchParams.set('form', 'hpcapt');
                // fullstartdate 格式如 "202605071600"，拼成 HpDate 所需的 "20260507_1600"
                const fs = img.fullstartdate || '';
                const hpDate = fs.length >= 12
                    ? fs.slice(0, 8) + '_' + fs.slice(8)
                    : fs;
                const filters = 'HpDate:"' + hpDate + '" mgzv3configlist:"BingQA_Encyclopedia_Layout"';
                u.searchParams.set('filters', filters);
                copyrightlinkUrl = u.href;
            } else {
                copyrightlinkUrl = null;
            }
        }

        // 更新导航按钮的禁用状态
        function updateNavButtons() {
            const atFirst = currentIndex <= 0;
            const atLast = currentIndex >= images.length - 1;
            prevBtn.disabled = atFirst;
            nextBtn.disabled = atLast;
        }

        function showImage(index) {
            if (images.length === 0) return;
            if (index < 0 || index >= images.length) return;
            currentIndex = index;

            const image = images[currentIndex];
            const wallpaperUrl = "https://www.bing.com" + image.url;

            showBackground(wallpaperUrl);
            updateInfo(image);
            updateNavButtons();
        }

        async function fetchImages() {
            try {
                // 优先使用缓存
                const cached = getCachedImages();
                if (cached) {
                    images = cached;
                    if (images.length > 0) {
                        // 默认展示最后一张（当日）
                        showImage(images.length - 1);
                        return;
                    }
                }

                const res = await fetch(API);
                if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
                const data = await res.json();
                // 反转数组，使 images[0] 为最老、images[last] 为当日最新
                images = data.images.reverse();

                if (images && images.length > 0) {
                    setCachedImages(images);
                    // 默认展示最后一张（当日）
                    showImage(images.length - 1);
                }
            } catch (err) {
                const msg = String(err);
                briefCard.textContent = '加载失败';
                titleEl.textContent = '错误';
                if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
                    metaEl.textContent = '网络请求失败，CORS 代理可能不可用。请检查网络后刷新页面。';
                } else {
                    metaEl.textContent = '错误详情：' + msg;
                }
            }
        }

        // ========== 设置面板 ==========
        const settingsArea = document.getElementById('settingsArea');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPopup = document.getElementById('settingsPopup');
        const toggleSearch = document.getElementById('toggleSearch');
        const searchWrapper = document.querySelector('.search-wrapper');
        const SETTINGS_KEY = 'bing_settings';

        // 读取已保存的设置
        function loadSettings() {
            try {
                const raw = localStorage.getItem(SETTINGS_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { /* ignore */ }
            return { showSearch: true };
        }

        function saveSettings(s) {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
            } catch (e) { /* ignore */ }
        }

        // 初始化设置
        const settings = loadSettings();
        toggleSearch.checked = settings.showSearch !== false;
        if (!toggleSearch.checked) {
            searchWrapper.classList.add('hidden');
        }

        // 切换浮窗显示
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsArea.classList.toggle('open');
        });

        // 点击外部关闭浮窗
        document.addEventListener('click', (e) => {
            if (!settingsArea.contains(e.target)) {
                settingsArea.classList.remove('open');
            }
        });

        // 阻止浮窗内部点击冒泡到 document
        settingsPopup.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // 搜索栏开关
        toggleSearch.addEventListener('change', () => {
            const show = toggleSearch.checked;
            settings.showSearch = show;
            saveSettings(settings);
            if (show) {
                searchWrapper.classList.remove('hidden');
            } else {
                searchWrapper.classList.add('hidden');
            }
        });

        // 事件绑定
        briefCard.addEventListener('click', (e) => {
            e.stopPropagation();
            if (copyrightlinkUrl) {
                window.open(copyrightlinkUrl, '_blank');
            }
        });

        detailCard.addEventListener('click', (e) => {
            e.stopPropagation();
            if (copyrightlinkUrl) {
                window.open(copyrightlinkUrl, '_blank');
            }
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!prevBtn.disabled) showImage(currentIndex - 1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!nextBtn.disabled) showImage(currentIndex + 1);
        });

        // 键盘导航（搜索框聚焦时禁用）
        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement && document.activeElement.tagName;
            if (activeTag === 'INPUT') return;
            if ((e.key === 'ArrowLeft' || e.key === 'Left') && !prevBtn.disabled) {
                showImage(currentIndex - 1);
            } else if ((e.key === 'ArrowRight' || e.key === 'Right') && !nextBtn.disabled) {
                showImage(currentIndex + 1);
            }
        });

        fetchImages();

        // 注册 Service Worker 缓存 Bing 图片
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('worker.js').then((reg) => {
                // 每日首次访问时清除旧图片缓存，防止无限增长
                const IMG_CACHE_DATE_KEY = 'bing_sw_cache_date';
                const today = getTodayStr();
                try {
                    if (localStorage.getItem(IMG_CACHE_DATE_KEY) !== today) {
                        localStorage.setItem(IMG_CACHE_DATE_KEY, today);
                        reg.active && reg.active.postMessage({ type: 'clear-image-cache' });
                    }
                } catch (e) { /* ignore */ }
            }).catch(() => {});
        }
    </script>
</body>
</html>
