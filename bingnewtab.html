<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing 每日壁纸</title>
    <style>
        :root {
            --card-r: 12px;
            --card-pad: 12px;
            --card-bg: rgba(0, 0, 0, 0.6);
            --text-main: #fff;
            --muted: rgba(255, 255, 255, 0.82);
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: "Segoe UI", Segoe, Tahoma, Arial, Verdana, sans-serif;
            background: #000;
            color: var(--text-main);
            overflow: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 0.8s ease-in-out;
            z-index: 0;
            opacity: 0;
        }

        .bg.show {
            opacity: 1;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: stretch;
            gap: 8px;
            z-index: 10;
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: var(--card-r);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            font-size: 16px;
            line-height: 1;
        }

        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .card-container {
            position: relative;
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(6px) saturate(120%);
            -webkit-backdrop-filter: blur(6px) saturate(120%);
            padding: var(--card-pad);
            border-radius: var(--card-r);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        
        .brief-card {
            display: flex;
            text-align: right;
            white-space: nowrap;
            font-size: 14px;
            max-width: 50vw;
            align-items: center;
            cursor: pointer;
        }

        .detail-card {
            display: none;
            flex-direction: column;
            width: 360px;
            max-width: 90vw;
            cursor: pointer;
            position: absolute;
            bottom: 0;
            right: 0;
        }

        .detail-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 6px 0;
        }

        .detail-card .meta {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.3;
        }

        .detail-card .hr {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 8px 0;
        }

        /* 仅当鼠标悬停在卡片容器上时显示详细卡片 */
        .card-container:hover .brief-card {
            display: none;
        }
        
        .card-container:hover .detail-card {
            display: flex;
        }

        /* 鼠标悬停在按钮上时，只改变背景色 */
        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

    </style>
</head>
<body>

    <div id="bgA" class="bg"></div>
    <div id="bgB" class="bg"></div>

    <div class="controls" id="controlsRegion">
        <button class="nav-btn" id="prevBtn" title="上一张">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                <path d="M11 14L5 8l6-6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="nav-btn" id="nextBtn" title="下一张">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                <path d="M5 14l6-6-6-6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
        </button>
        <div class="card-container">
            <div class="card brief-card" id="briefCard">加载中…</div>
            <div class="card detail-card" id="detailCard">
                <h3 id="imageTitle"></h3>
                <div class="hr"></div>
                <div class="meta" id="imageMeta"></div>
            </div>
        </div>
    </div>

    <script>
        // 代理避免CORS失败
        const API = 'https://mutsumi.sorali.org/api/cors/https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=8&mkt=zh-CN';
        const bgA = document.getElementById('bgA');
        const bgB = document.getElementById('bgB');
        const briefCard = document.getElementById('briefCard');
        const detailCard = document.getElementById('detailCard');
        const titleEl = document.getElementById('imageTitle');
        const metaEl = document.getElementById('imageMeta');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const controlsRegion = document.getElementById('controlsRegion');
        const cardContainer = document.querySelector('.card-container');

        let images = [];
        let currentIndex = 0;
        let copyrightlinkUrl = null;
        let front = bgA, back = bgB;

        function showBackground(url) {
            if (!url) return;
            const img = new Image();
            img.onload = function() {
                back.style.backgroundImage = `url("${url}")`;
                back.classList.add('show');
                front.classList.remove('show');
                setTimeout(() => {
                    let tmp = front;
                    front = back;
                    back = tmp;
                }, 800);
            };
            img.src = url;
        }

        function extractShort(s) {
            if (!s) return '每日壁纸';
            const str = String(s);
            const sep = [' — ', ' - ', '（', '(', '，', ', ', ' · '];
            for (const p of sep) {
                const idx = str.indexOf(p);
                if (idx > 0) return str.slice(0, idx);
            }
            return str.length > 40 ? str.slice(0, 37) + '...' : str;
        }

        function updateInfo(img) {
            const title = img.title || extractShort(img.copyright);
            briefCard.textContent = extractShort(title);
            titleEl.textContent = title;
            metaEl.textContent = img.copyright || '';
            copyrightlinkUrl = img.copyrightlink;
        }

        function showImage(index) {
            if (images.length === 0) return;
            if (index < 0) index = images.length - 1;
            if (index >= images.length) index = 0;
            currentIndex = index;

            const image = images[currentIndex];
            const wallpaperUrl = "https://www.bing.com" + image.url;

            showBackground(wallpaperUrl);
            updateInfo(image);
        }

        async function fetchImages() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                images = data.images;
                if (images && images.length > 0) {
                    showImage(0);
                }
            } catch (err) {
                briefCard.textContent = '加载失败';
                titleEl.textContent = '错误';
                metaEl.textContent = String(err);
            }
        }

        // 事件绑定
        detailCard.addEventListener('click', (e) => {
            e.stopPropagation();
            if (copyrightlinkUrl) {
                window.open(copyrightlinkUrl, '_blank');
            }
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showImage(currentIndex - 1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showImage(currentIndex + 1);
        });

        fetchImages();
    </script>
</body>
</html>
